
<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <title>Clasificador de Perros y Gatos</title>

    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <style>
      :root {
        --bg-color: #cbd5e1;
        --card-bg: #ffffff;
        --text-color: #334155;
      }

      body {
        background-color: var(--bg-color);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        color: var(--text-color);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        margin: 0;
        padding: 2rem 1rem;
      }

      .header-section {
        margin-bottom: 2.5rem;
      }

      .header-section h1 {
        font-weight: 600;
        letter-spacing: -0.5px;
        color: #1e293b;
        font-size: 2.25rem;
      }

      .gallery-card {
        background: var(--card-bg);
        padding: 1.5rem;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
        display: inline-block;
      }

      .canvas-wrapper {
        background-color: #000000;
        width: 400px;
        height: 400px;
        max-width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 1.5rem auto;
      }

      #canvas {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .btn-minimal {
        background-color: #1e293b;
        color: #ffffff;
        border: none;
        border-radius: 0;
        padding: 0.6rem 1.8rem;
        font-size: 0.9rem;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        font-weight: 500;
        transition: background-color 0.2s ease;
      }

      .btn-minimal:hover {
        background-color: #475569;
        color: #ffffff;
      }

      .result-container {
        margin-top: 1.5rem;
      }

      #resultado {
        font-size: 1.4rem;
        font-weight: 500;
        color: #334155;
        letter-spacing: 0.5px;
      }
    </style>
  </head>

  <body>
    <main class="w-100 text-center">
      <div class="header-section">
        <h1>Clasificador de Perros y Gatos</h1>
      </div>

      <div class="container">
        <div class="row justify-content-center">
          <div class="col-auto">
            <div class="gallery-card">

              
              <video id="video" playsinline autoplay style="width: 1px; height: 1px; position: absolute; opacity: 0;"></video>
              <canvas id="otrocanvas" width="100" height="100" style="display: none"></canvas>

              
              <div class="canvas-wrapper">
                <canvas id="canvas" width="400" height="400"></canvas>
              </div>

              
              <div>
                <button class="btn btn-minimal" id="cambiar-camara" onclick="cambiarCamara();">
                  Cambiar cámara
                </button>
              </div>

              
              <div class="result-container">
                <div id="resultado">Cargando modelo...</div>
              </div>

            </div>
          </div>
        </div>
      </div>
    </main>

    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFyZlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>

    <script type="text/javascript">
      var tamano = 400;
      var video = document.getElementById("video");
      var canvas = document.getElementById("canvas");
      var otrocanvas = document.getElementById("otrocanvas");
      var ctx = canvas.getContext("2d");
      var currentStream = null;
      var facingMode = "user";

      var modelo = null;

      
      (async () => {
        try {
          console.log("Cargando modelo...");

          modelo = await tf.loadGraphModel("./model.json");

          console.log("Modelo cargado correctamente");
          console.log("Entradas del modelo:", modelo.inputs);
          console.log("Salidas del modelo:", modelo.outputs);

          document.getElementById("resultado").innerHTML =
            "Listo para detectar";

        } catch (error) {
          console.error("Error al cargar el modelo:", error);

          document.getElementById("resultado").innerHTML =
            "Error al cargar el modelo";
        }
      })();

      window.onload = function() {
        mostrarCamara();
      };

      function mostrarCamara() {
        var opciones = {
          audio: false,
          video: {
            width: tamano,
            height: tamano
          }
        };

        if (navigator.mediaDevices.getUserMedia) {
          navigator.mediaDevices.getUserMedia(opciones)
            .then(function(stream) {
              currentStream = stream;
              video.srcObject = currentStream;

              procesarCamara();
              predecir();
            })
            .catch(function(err) {
              alert("No se pudo utilizar la cámara :(");
              console.log(err);
            });
        } else {
          alert("No existe la función getUserMedia");
        }
      }

      function cambiarCamara() {
        if (currentStream) {
          currentStream.getTracks().forEach(track => {
            track.stop();
          });
        }

        facingMode = facingMode == "user" ? "environment" : "user";

        var opciones = {
          audio: false,
          video: {
            facingMode: facingMode,
            width: tamano,
            height: tamano
          }
        };

        navigator.mediaDevices.getUserMedia(opciones)
          .then(function(stream) {
            currentStream = stream;
            video.srcObject = stream;
          })
          .catch(function(err) {
            console.log("Oops, hubo un error", err);
          });
      }

      function procesarCamara() {
        if (video.readyState >= 2) {
          ctx.drawImage(
            video,
            0, 0,
            tamano, tamano,
            0, 0,
            tamano, tamano
          );
        }

        setTimeout(procesarCamara, 20);
      }

      // Predecir si la imagen corresponde a un perro o un gato
      function predecir() {
        if (modelo != null && video.readyState >= 2) {
          var tensor = null;
          var salida = null;
          var salidas = [];

          try {
            resample_single(canvas, 100, 100, otrocanvas);

            var ctx2 = otrocanvas.getContext("2d");
            var imgData = ctx2.getImageData(0, 0, 100, 100);

            var arr = [];

            for (var p = 0; p < imgData.data.length; p += 4) {
              var rojo = imgData.data[p] / 255;
              var verde = imgData.data[p + 1] / 255;
              var azul = imgData.data[p + 2] / 255;

              var gris = (rojo + verde + azul) / 3;

              arr.push(gris);
            }

            // Imagen de 100 x 100 con un canal de color.
            tensor = tf.tensor4d(arr, [1, 100, 100, 1]);

            // GraphModel utiliza execute().
            salida = modelo.execute(tensor);

            // Si hay varias salidas, utilizar la primera.
            if (Array.isArray(salida)) {
              salidas = salida;
              salida = salidas[0];
            }

            var valores = salida.dataSync();
            var valor = valores[0];

            var respuesta = valor <= 0.5 ? "Gato" : "Perro";

            document.getElementById("resultado").innerHTML =
              respuesta;

          } catch (error) {
            console.error("Error al predecir:", error);

            document.getElementById("resultado").innerHTML =
              "Error al realizar la predicción";

          } finally {
            if (salida && typeof salida.dispose === "function") {
              salida.dispose();
            }

            salidas.forEach(function(t) {
              if (t && typeof t.dispose === "function") {
                t.dispose();
              }
            });

            if (tensor) {
              tensor.dispose();
            }
          }
        }

        setTimeout(predecir, 150);
      }

      // Redimensionar la imagen
      function resample_single(canvas, width, height, resize_canvas) {
        var width_source = canvas.width;
        var height_source = canvas.height;

        width = Math.round(width);
        height = Math.round(height);

        var ratio_w = width_source / width;
        var ratio_h = height_source / height;
        var ratio_w_half = Math.ceil(ratio_w / 2);
        var ratio_h_half = Math.ceil(ratio_h / 2);

        var ctx = canvas.getContext("2d");
        var ctx2 = resize_canvas.getContext("2d");

        var img = ctx.getImageData(0, 0, width_source, height_source);
        var img2 = ctx2.createImageData(width, height);

        var data = img.data;
        var data2 = img2.data;

        for (var j = 0; j < height; j++) {
          for (var i = 0; i < width; i++) {
            var x2 = (i + j * width) * 4;

            var weight = 0;
            var weights = 0;
            var weights_alpha = 0;

            var gx_r = 0;
            var gx_g = 0;
            var gx_b = 0;
            var gx_a = 0;

            var center_y = (j + 0.5) * ratio_h;
            var yy_start = Math.floor(j * ratio_h);
            var yy_stop = Math.ceil((j + 1) * ratio_h);

            for (var yy = yy_start; yy < yy_stop; yy++) {
              var dy = Math.abs(center_y - (yy + 0.5)) / ratio_h_half;

              var center_x = (i + 0.5) * ratio_w;

              var w0 = dy * dy;

              var xx_start = Math.floor(i * ratio_w);
              var xx_stop = Math.ceil((i + 1) * ratio_w);

              for (var xx = xx_start; xx < xx_stop; xx++) {
                var dx = Math.abs(center_x - (xx + 0.5)) / ratio_w_half;

                var w = Math.sqrt(w0 + dx * dx);

                if (w >= 1) {
                  continue;
                }

                weight = 2 * w * w * w - 3 * w * w + 1;

                var pos_x = 4 * (xx + yy * width_source);

                gx_a += weight * data[pos_x + 3];
                weights_alpha += weight;

                if (data[pos_x + 3] < 255) {
                  weight = weight * data[pos_x + 3] / 250;
                }

                gx_r += weight * data[pos_x];
                gx_g += weight * data[pos_x + 1];
                gx_b += weight * data[pos_x + 2];

                weights += weight;
              }
            }

            data2[x2] = gx_r / weights;
            data2[x2 + 1] = gx_g / weights;
            data2[x2 + 2] = gx_b / weights;
            data2[x2 + 3] = gx_a / weights_alpha;
          }
        }

        ctx2.putImageData(img2, 0, 0);
      }
    </script>
  </body>
</html>
